Câu 13: Biên giới quốc gia là: 
A.Đường và mặt thẳng đứng giới hạn bởi chủ quyền lãnh thổ quốc gia.
B. Đường và mặt thẳng đứng đi qua đường đó để giới hạn biên giới quốc gia.
C. Đường và mặt phẳng thẳng đứng theo đường đó để xác định biên giới quốc gia.
D.Đường cụ thể được thể hiện trên bản đồ để giới hạn lãnh thổ quốc gia.
Câu 14: Quan điểm của Đảng và Nhà nước ta về biên giới và quản lý, bảo vệ biên giới quốc gia là:
A.Quản lý bảo vệ biên giới quốc gia là nhiệm vụ chung của toàn Đảng, toàn dân, của các cấp, các ngành.
B. Quản lý, bảo vệ an ninh chính trị, trật tự, an toàn xã hội trên khu vực biên giới.
C. Quản lý, bảo vệ công trình quốc phòng trên khu vực biên giới, các công trình bảo vệ biên giới.
D.Quản lý, bảo vệ việc thực thi pháp luật, quy chế biên giới và các điều ước quốc tế về biên giới.
Câu 15: Giải pháp, hình thức quản lý, bảo vệ biên giới quốc gia là:
A.Quản lý, bảo vệ biên giới bình thường.
B. Quản lý bảo vệ biên giới liên tục, xuyên suốt.
C. Quản lý bảo vệ biên giới trước khi có chiến tranh.
D.Quản lý bảo vệ biên giới bất ổn về chính trị.
Câu 16: Điền từ còn thiếu: “Nhà nước ... đầy đủ và hoàn toàn đối với lãnh hải và vùng trời, đáy biển và lòng đất dưới đáy biển của lãnh hải”.
A.Thực hiện quyền quyết định.
B. Thực hiện chủ quyền.
C. Xác định chủ quyền.
D.Hoạch định và thực hiện. 
Câu 17: Quan điểm của Đảng và Nhà nước về quốc gia, biên giới và quản lý, bảo vệ biên giới quốc gia là:
A.Quản lý bảo vệ biên giới quốc gia là nhiệm vụ chung của toàn Đảng, toàn dân, của các cấp, các ngành.
B. Quản lý, bảo vệ an ninh chính trị, trật tự, an toàn xã hội trên khu vực biên giới. 
C. Quản lý, bảo vệ công trình quốc phòng trên khu vực biên giới, các công trình bảo vệ biên giới. 
D.Quản lý, bảo vệ việc thực thi pháp luật, quy chế biên giới và các điều ước quốc tế về biên giới.
Câu 18: Lãnh thổ quốc gia là:
A.Phạm vi không gian được giới hạn bởi biên giới quốc gia.
B. Phạm vi không gian của vùng đất, vùng trời và vùng biển quốc gia.
C. Phạm vi giới hạn thuộc chủ quyền hoàn toàn và đầy đủ của quốc gia.
D.Phạm vi giới hạn một phần của trái đất thuộc chủ quyền quốc gia.
Câu 19: Lãnh thổ quốc gia bao gồm: 
A.Vùng đất, vùng nước, vùng trời và các quần đảo.
B. Vùng đất, vùng biển, vùng đặc quyền kinh tế và vùng nội thủy.
C. Vùng đất, vùng biển, vùng trời và vùng lãnh thổ quốc gia đặc biệt.
D.Vùng đất, lãnh hải, thềm lục địa và vùng trời.
Câu 20: Biên giới quốc gia Việt Nam trên đất liền là đường phân định:
A.Phạm vi vùng đất quốc gia Việt Nam với quốc gia khác.
B. Ranh giới lãnh thổ quốc gia Việt Nam với quốc gia khác.
C. Phạm vi lãnh thổ quốc gia Việt Nam với quốc gia khác.
D.Lãnh thổ trên bề mặt đất liền của vùng đất quốc gia Việt Nam.
Câu 21: Biên giới quốc gia Việt Nam bao gồm:
A.Biên giới quốc gia trên đất liền, trên biển và trên lãnh thổ quốc gia đặc biệt.
B. Biên giới quốc gia trên mặt đất, trong lòng đất, trên mặt biển và dưới lòng đất.
C. Biên giới quốc gia trên đất liền, trên không, trên biển và trong lòng đất.
D.Biên giới quốc gia trên đất liền, trên các đảo, các quần đảo và trong lòng đất.
Câu 22: Chủ quyền quốc gia là:
A.Quyền tối cao về lập pháp, hành pháp và tư pháp của một quốc gia.
B. Quyền làm chủ thiêng liêng về chính trị, kinh tế, văn hóa – xã hội của quốc gia.
C. Quyền làm chủ một cách độc lập, toàn vẹn và đầy đủ về lập pháp, hành pháp và tư pháp.
D.Quyền làm chủ một cách độc lập, tự quyết định mọi vấn đề đối nội, đối ngoại của quốc gia.
Câu 23: Chủ quyền lãnh thổ quốc gia là:
A.Quyền tối cao, tuyệt đối, riêng biệt đối với quốc gia trên vùng lãnh thổ của mình.
B. Quyền thiêng liêng bất khả xâm phạm, quyết định mọi vấn đề của quốc gia trên vùng lãnh thổ của mình.
C. Một bộ phận của chủ quyền quốc gia, là quyền quyết định mọi vấn đề chính trị, kinh tế, văn hóa, xã hội.
D.Một bộ phận của chủ quyền quốc gia, khẳng định quyền làm chủ của quốc gia đó trên vùng lãnh thổ của mình.
Câu 24: Quan điểm của Đảng về xây dựng và bảo vệ chủ quyền lãnh thổ, biên giới quốc gia là:
A.Chủ quyền lãnh thổ, biên giới quốc gia là một bộ phận rất quan trọng của cách mạng Việt Nam.
B. Chủ quyền lãnh thổ, biên giới quốc gia là yếu tố cơ bản nhất cho sự nghiệp xây dựng và bảo vệ Tổ quốc.
C. Chủ quyền lãnh thổ, biên giới quốc gia là thiêng liêng bất khả xâm phạm của dân tộc Việt Nam. 
D.Chủ quyền lãnh thổ, biên giới quốc gia là nội dung chủ yếu trong sự nghiệp xây dựng và bảo vệ Tổ quốc.
Câu 25: Huyện đảo Trường Sa thuộc tỉnh, thành phố nào của nước ta?
A. Tỉnh Quảng Ngãi.
B. Tỉnh Phú Yên.
C. Tỉnh Khánh Hòa.
D. Thành phố Bà Rịa – Vũng Tàu.
Câu 26: Nội dung xây dựng và bảo vệ chủ quyền lãnh thổ quốc gia là:
A.Xây dựng và phát triển tiềm lực kinh tế, chính trị, quốc phòng, an ninh của đất nước.
B. Xây dựng và phát triển toàn diện nền kinh tế, kết hợp với tăng cường quốc phòng – an ninh của đất nước.
C. Xây dựng và phát triển nền quốc phòng toàn dân, an ninh nhân dân của đất nước.
D.Xây dựng và phát triển mọi mặt chính trị, kinh tế, văn hóa, xã hội, đối ngoại và quốc phòng, an ninh của đất nước.
Câu 27: Bảo vệ chủ quyền lãnh thổ quốc gia là:
A.Sử dụng các lực lượng và các biện pháp làm thất bại mọi âm mưu, thủ đoạn chống phá của kẻ thù để giữ gìn toàn vẹn lãnh thổ quốc gia.
B. Sử dụng tổng hợp các lực lượng và biện pháp chống lại sự xâm phạm, phá hoại dưới mọi hình thức để giữ gìn toàn vẹn chủ quyền nhà nước đối với lãnh thổ quốc gia.
C. Sử dụng tổng hợp các lực lượng vũ trang đánh bại mọi hành động phá hoại, xâm lược của kẻ thù để bảo vệ độc lập, chủ quyền, thống nhất toàn vẹn lãnh thổ.
D.Sử dụng mọi lực lượng, phương tiện, đấu tranh toàn diện trên tất cả mọi lĩnh vực kinh tế, chính tri, quốc phòng, an ninh, đối ngoại để bảo vệ chủ quyền lãnh thổ quốc gia.
Câu 28: Nội dung xây dựng và bảo vệ chủ quyền lãnh thổ quốc gia là:
A.Xây dựng, phát triển mọi mặt nền quốc phòng toàn dân, an ninh nhân dân.
B. Xây dựng, phát triển toàn diện nền kinh tế, kết hợp với tăng cường quốc phòng – an ninh.
C. Xác lập và bảo vệ quyền lập pháp, hành pháp, tư pháp của Việt Nam trên mọi mặt.
D.Kết hợp chặt chẽ giữa phát triển kinh tế với đấu tranh quân sự và bảo đảm an ninh chính trị.
Câu 29: Làm tốt nhiệm vụ xây dựng và bảo vệ chủ quyền lãnh thổ quốc gia là:
A.Thực hiện tốt hai nhiệm vụ chiến lược của cách mạng Việt Nam.
B. Trực tiếp bảo vệ Tổ quốc, bảo vệ chế độ xã hội chủ nghĩa ở Việt Nam.
C. Trực tiếp góp phần xây dựng và bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa.
D.Thực hiện kết hợp phát triển kinh tế, xã hội với tăng cường quốc phòng – an ninh.
Câu 30: Khu vực biên giới trên đất liền của Việt Nam gồm:
A.Xã, phường, thị trấn tiếp giáp biên giới quốc gia trên đất liền. 
B. Xã, phường, thị trấn có một phần địa giới hành chính trùng hợp với biên giới quốc gia trên đất liền.
C. Khu vực thuộc các xã, phường, thị trấn có chiều rộng 10 km tính từ đường biên giới quốc gia trên đất liền.
D.Khu vực các xã, phường, thị trấn nằm liền kề đường biên giới quốc gia trên đất liền.
Câu 31: Xây dựng và bảo vệ biên giới quốc gia là:
A.Thực hiện tổng thể các giải pháp một cách toàn diện trên tất cả các lĩnh vực của đời sống xã hội trên khu vực biên giới.
B. Thực hiện tổng thể các chủ trương chính sách của Đảng, pháp luật của Nhà nước trên tất cả mọi lĩnh vực trên khu vực biên giới.
C. Thực hiện tổng thể mọi hoạt động trên các lĩnh vực kinh tế, chính trị, văn hóa, xã hội, đối ngoại, quốc phòng, an ninh trên khu vực biên giới.
D.Thực hiện tổng thể các biện pháp để bảo vệ chủ quyền lãnh thổ, bảo vệ tài nguyên, môi sinh, môi trường, lợi ích quốc gia trên khu vực biên giới.
Câu 32: Biên giới quốc gia của Việt Nam là:
A.Đường và mặt phẳng nằm ngang.
B. Hệ thống các tọa độ được xác định.
C. Đường và mặt phẳng thẳng đứng.
D.Hệ thống các đường và mặt phẳng.
Câu 33: Căn cứ Luật Biên giới quốc gia, “xây dựng, quản lý, bảo vệ biên giới quốc gia, khu vực biên giới” là:
A.Sự nghiệp của toàn dân do Nhà nước thống nhất quản lý.
B. Sự nghiệp của cả đất nước do Đảng lãnh đạo.
C. Sự nghiệp của cả dân tộc do nhân dân làm chủ.
D.Sự nghiệp của cả hệ thống chính trị do Nhà nước quản lý.
Câu 34: Nội dung xây dựng và bảo vệ biên giới quốc gia là:
A.Tăng cường hợp tác với các nước trên thế giới vì hòa bình, ổn định và phát triển.
B. Tăng cường, mở rộng quan hệ đối ngoại các cấp trên khu vực biên giới.
C. Tăng cường hợp tác phát triển kinh tế, quốc phòng, an ninh với các nước láng giềng.
D.Tăng cường hợp tác chiến lược, ổn định lâu dài với các nước láng giềng.
Câu 35: “ Xây dựng, quản lý, bảo vệ biên giới quốc gia, khu vực biên giới là sự nghiệp của toàn dân do Nhà nước thống nhất quản lý” được quy định trong bộ luật nào của nước ta?
A.Luật Quốc phòng.
B. Luật Biên giới.
C. Luật Nghĩa vụ quân sự. 
D.Luật Công An.
Câu 36: “Giữ gìn an ninh chính trị, trật tự an toàn xã hội ở khu vực biên giới” là một trong những nội dung của:
A.Xây dựng và bảo vệ chủ quyền lãnh thổ quốc gia.
B. Xây dựng và bảo vệ biên giới quốc gia.
C. Xây dựng và bảo vệ Tổ quốc.
D.Xây dựng và bảo vệ nhân dân khu vực biên giới.
Câu 37: Quan điểm xây dựng biên giới hòa bình hữu nghị, ổn định là:
A.Vấn đề chiến lược lâu dài của cách mạng Việt Nam.
B. Vấn đề sống còn của sự nghiệp công nghiệp hóa, hiện đại hóa đất nước.
C. Vấn đề cốt lõi trong đường lối cách mạng Việt Nam.
D.Vấn đề đặc biệt quan trọng của sự nghiệp xây dựng và bảo vệ Tổ quốc.
Câu 38: Quan điểm của Đảng và Nhà nước ta trong giải quyết các vấn đề tranh chấp lãnh thổ, biên giới là:
A.Thông qua đối thoại ngoại giao vừa hợp tác, vừa đấu tranh và đàm phán thương lượng hòa bình, bảo đảm lợi ích của nhau.
B. Thông qua đàm phán hòa bình, tôn trọng độc lập, chủ quyền, toàn vẹn lãnh thổ và lợi ích chính đáng của nhau.
C. Thông qua luật pháp quốc tế trên cơ sở thương lượng hòa bình, tôn trọng độc lập chủ quyền và lợi ích chính đáng của nhau.
D.Thông qua thương lượng cấp nhà nước giữa các bên, bằng nhiều biện pháp ngoại giao thân thiện nhất là đàm phán hòa bình thông qua diễn đàn quốc tế.
Câu 39: Việt Nam có đường biên giới quốc gia trên đất liền dài:
A.4550 km.
B. 4505 km.
C. 5450 km.
D.5405 km.
Câu 40: Việt Nam có đường biên giới tiếp giáp với Trung Quốc dài:
A.1530 km.
B. 1503 km.
C. 1305 km.
D.1350 km.
Câu 41: Việt Nam có đường biên giới tiếp giáp với Lào dài:
A.2607 km.
B. 2670 km. 
C. 2067 km.
D.2076 km.
Câu 42: Việt Nam có đường biên giới tiếp giáp với Campuchia dài:
A.1317 km.
B. 1371 km.
C. 1173 km.
D.1137 km.
BÀI 9: XÂY DỰNG LỰC LƯỢNG DÂN QUÂN TỰ VỆ, LỰC LƯỢNG DỰ BỊ ĐỘNG VIÊN VÀ ĐỘNG VIÊN CÔNG NGHIỆP QUỐC PHÒNG.
Câu 1: Quan điểm, nguyên tắc xây dựng lực lượng dự bị động viên là:
A. Bảo đảm số lượng đủ, chất lượng cao toàn diện, rộng khắp, sẵn sàng chiến đấu cao.
B. Bảo đảm toàn diện nhưng có trọng điểm chủ yếu xây dựng chất lượng.
C. Bảo đảm số lượng đủ, chất lượng cao, xây dựng toàn diện nhưng có trọng tâm, trọng điểm.
D. Bảo đảm số lượng đông, chất lượng cao cho những đơn vị sẵn sàng chiến đấu.
Câu 2: Phương châm huấn luyện đối với lực lượng dự bị động viên:
A. Chất lượng, thiết thực, hiệu quả tập trung vào khoa học quân sự hiện đại.
B. Cơ bản, thống nhất coi trọng khâu kỹ thuật tác chiến, phối hợp giữa các lực lượng.
C. Chất lượng, thiết thực, hiệu quả, sát thực tế chiến đấu tại địa bàn.
D. Chất lượng, thiết thực, hiệu quả, tập trung có trọng tâm, trọng điểm.
Câu 3: Thẩm quyền quyết định và thông báo quyết định động viên công nghiệp quốc phòng do cấp nào quy định?
A. Bộ Quốc phòng.
B. Chủ tịch nước.
C. Chủ tịch Quốc hội.
D. Chính phủ.
Câu 4: Thực hiện huấn luyện, diễn tập, kiểm tra đối với lực lượng dự bị động viên nhằm:
A. Giúp nâng cao chất lượng đáp ứng yêu cầu sẵn sàng chiến đấu và chiến đấu.
B. Giúp nâng cao chất lượng đáp ứng yêu cầu động viên tham gia mở rộng quân đội.
C. Giúp nâng cao chất lượng đáp ứng yêu cầu động viên và tổng động viên khi có lệnh.
D. Giúp lãnh đạo, chỉ huy nắm được thực trạng tổ chức, xây dựng lực lượng dự bị động viên.
Câu 5: Căn cứ Luật Dân quân tự vệ 2019, lực lượng dân quân tự vệ được phân loại gồm:
A. Dân quân tự vệ tại chỗ; Dân quân tự vệ cơ động.
B. Dân quân thường trực; Dân quân tự vệ biển. 
C. Dân quân tự vệ phòng không, pháo binh, trinh sát, thông tin, công binh, phòng hóa, y tế.
D. Tất cả đều đúng.
Câu 6: Dân quân tự vệ được xác định là lực lượng như thế nào trong nền quốc phòng toàn dân?
A. Là lực lượng cơ bản trong xây dựng nền quốc phòng toàn dân.
B. Là lực lượng nòng cốt trong xây dựng nền quốc phòng toàn dân.
C. Là lực lượng xung kích trong xây dựng nền quốc phòng toàn dân.
D. Là lực lượng quyết định trong xây dựng nền quốc phòng toàn dân và an ninh nhân dân.
Câu 7: Lực lượng dân quân tự vệ đặt dưới sự chỉ đạo trực tiếp của:
A. Bộ Quốc phòng.
B. Cơ quan quân sự địa phương.
C. Ủy ban nhân dân các cấp.
D. Hội đồng nhân dân các cấp. 
Câu 8: Lực lượng dân quân tự vệ đặt dưới sự chỉ huy thống nhất của:
A. Bộ chỉ huy quân sự các cấp.
B. Bộ Quốc phòng.
C. Ủy ban nhân dân các cấp.
D. Hội đồng nhân dân các cấp. 
Câu 9: Nội dung của phương châm xây dựng dân quân tự vệ hiện nay:
A. Chú trọng chất lượng chính trị. 
B. Coi trọng chất lượng là chính.
C. Tăng cường sức mạnh chiến đấu. 
D. Xây dựng toàn diện.
Câu 10: Dân quân tự vệ là:
A. Lực lượng vũ trang quần chúng không thoát ly sản xuất, công tác.
B. Lực lượng quần chúng được vũ trang sẵn sàng chiến đấu.
C. Lực lượng vũ trang quần chúng bảo vệ và duy trì sản xuất, công tác.
D. Lực lượng vũ trang quần chúng bảo vệ nền kinh tế và văn hóa.
Câu 11: Nhiệm vụ của lực lượng dân quân tự vệ là:
A. Học tập chính trị, quân sự, sẵn sàng chiến đấu bảo vệ nhân dân.
B. Học tập chính trị, thường xuyên luyện tập và sẵn sàng chiến đấu.
C. Học tập chính trị, pháp luật, huấn luyện quân sự và diễn tập.
D. Học tập chính trị, quân sự và bảo vệ an ninh kinh tế, văn hóa.
Câu 12: Đối tượng giáo dục chính trị, huấn luyện quân sự trong lực lượng dân quân tự vệ là: 
A. Toàn thể cán bộ, chiến sĩ dân quân tự vệ.
B. Toàn thể cán bộ dân quân tự vệ.
C. Toàn thể chiến sĩ dân quân tự vệ.
D. Toàn thể cán bộ, đảng viên dân quân tự vệ.
Câu 13: Vị trí, vai trò của dân quân tự vệ là:
A. Lực lượng nòng cốt trong bảo vệ sản xuất, đời sống nhân dân trong chiến tranh bảo vệ Tổ quốc.
B. Lực lượng xung kích trong bảo vệ sản xuất, phòng chống, khắc phục hậu quả thiên tai, địch họa.
C. Lực lượng nòng cốt sẵn sàng chiến đấu, phục vụ chiến đấu và bảo vệ nhân dân.
D. Lực lượng nòng cốt trong phong trào toàn dân đánh giặc trong chiến tranh bảo vệ Tổ quốc.
Câu 14: Quân nhân dự bị động viên được đăng ký, quản lý tại:
A. Nơi công tác.
B. Nơi cư trú.
C. Đơn vị dự bị động viên.
D. Nơi tập trung động viên.
Câu 15: Độ tuổi của công dân Việt Nam tham gia lực lượng dân quân tự vệ trong thời bình là:
A. Nam từ đủ 18 tuổi đến hết 45 tuổi, nữ từ đủ 18 tuổi đến hết 40 tuổi.
B. Nam từ đủ 20 tuổi đến hết 45 tuổi, nữ từ đủ 18 tuổi đến hết 40 tuổi.
C. Nam từ đủ 18 tuổi đến hết 50 tuổi, nữ từ đủ 20 tuổi đến hết 45 tuổi.
D. Nam từ đủ 20 tuổi đến hết 45 tuổi, nữ từ đủ 20 tuổi đến hết 40 tuổi.
Câu 16: Quan điểm, nguyên tắc xây dựng lực lượng dự bị động viên là:
A. Phát huy sức mạnh của toàn dân trên tất cả các lĩnh vực hoạt động xã hội.
B. Xây dựng lực lượng dự bị động viên hùng mạnh, sẵn sàng chiến đấu cao.
C. Phát huy sức mạnh của các bộ, ngành và địa phương.
D. Phát huy sức mạnh tổng hợp của cả hệ thống chính trị ở địa phương.
Câu 17: Nhiệm vụ của lực lượng dân quân tự vệ cơ động là:
A. Chiến đấu, tiêu diệt địch, đánh bại địch tiến công trên địa bàn địa phương.
B. Chiến đấu, sẵn sàng chiến đấu trên địa bàn địa phương theo phương án.
C. Chiến đấu, cơ động chiến đấu trên địa bàn địa phương theo kế hoạch.
D. Chiến đấu, tiêu hao, tiêu diệt địch, chi viện cho lực lượng chiến đấu tại chỗ.
Câu 18: “Phát huy sức mạnh tổng hợp trên địa bàn để xây dựng lực lượng dân quân tự vệ” là một trong những nội dung của:
A. Biện pháp xây dựng lực lượng dân quân tự vệ.
B. Nhiệm vụ xây dựng lực lượng dân quân tự vệ. 
C. Vị trí vai trò quan trong xây dựng lực lượng dân quân tự vệ.
D. Nội dung cơ bản xây dựng lực lượng dân quân tự vệ.
Câu 19: “Bảo đảm số lượng đủ, chất lượng cao, xây dựng toàn diện nhưng có trọng tâm, trọng điểm” là một trong những nội dung của:
A. Quan điểm, nguyên tắc xây dựng lực lượng dự bị động viên.
B. Nhiệm vụ xây dựng lực lượng dự bị động viên.
C. Biện pháp chủ yếu xây dựng lực lượng dự bị động viên.
D. Giải pháp cơ bản xây dựng lực lượng dự bị động viên.
Câu 20: Cơ quan thực hiện việc đăng ký, quản lý quân nhân dự bị động viên là:
A. Ban lãnh đạo cơ quan, đơn vị công tác.
B. Ban chỉ huy quân sự xã (phường, thị trấn), Ban chỉ huy đơn vị dự bị động viên.
C. Ban chỉ huy quân sự xã (phường, thị trấn), Ban chỉ huy quân sự huyện (quận, thị xã, thành phố thuộc tỉnh).
D. Ban chỉ huy quân sự huyện (quận, thị xã, thành phố thuộc tỉnh) và đơn vị dự bị động viên.
Câu 21: Một trong những nguyên tắc sắp xếp quân nhân dự bị vào các đơn vị dự bị động viên là:
A. Theo khả năng về sức khỏe, tuổi đời và nơi cư trú.
B. Theo trình độ chuyên môn nghiệp vụ, theo nghề nghiệp.
C. Theo trình độ kỹ thuật, chiến thuật, chức vụ và sức khỏe.
D. Theo trình độ chuyên nghiệp quân sự, chuyên môn kỹ thuật.
Câu 22: Việc bảo đảm vật chất, kinh phí xây dựng lực lượng dự bị động viên hàng năm do:
A. Các bộ, ngành, địa phương phối hợp với các đơn vị dự bị động viên thực hiện.
B. Chính phủ giao chỉ tiêu nhiệm vụ cụ thể cho các bộ, ngành, địa phương thực hiện.
C. Các địa phương chủ động phối hợp với các đơn vị dự bị động viên thực hiện.
D. Chính phủ giao chỉ tiêu cho các đơn vị dự bị động viên và địa phương thực hiện.
Câu 23: Nội dung xây dựng lực lượng dự bị động viên là:
A. Tạo nguồn, đăng ký, quản lý lực lượng dự bị động viên.
B. Tạo nguồn, biên chế và đăng ký lực lượng dự bị động viên.
C. Tạo nguồn, tổ chức và quản lý lực lượng dự bị động viên.
D. Tạo nguồn, quản lý và kiểm tra lực lượng dự bị động viên.
Câu 24: Phương tiện kỹ thuật của lực lượng dự bị động viên thường gồm:
A. Phương tiện xếp dỡ, san lấp mặt bằng, cầu phà, thông tin liên lạc và một số phương tiện khác.
B. Phương tiện thông tin liên lạc, y tế, phương tiện vận tải, cứu hỏa và một số phương tiện khác.
C. Phương tiện vận tải, làm đường, xếp dỡ, thông tin liên lạc, y tế và một số phương tiện khác.
D. Phương tiện vận tải, cầu đường, thông tin liên lạc và các thiết bị khoa học công nghệ. 
Câu 25: Dân quân được tổ chức ở:
A. Xã, phường, thị trấn, cơ quan nhà nước, đơn vị sự nghiệp.
B. Xã, phường, thị trấn, cơ quan nhà nước.
C. Xã, phường, thị trấn, đơn vị sự nghiệp.
D. Xã, phường, thị trấn.
Câu 26: Quân nhân dự bị gồm:
A. Sỹ quan dự bị, quân nhân chuyên nghiệp dự bị.
B. Hạ sỹ quan và binh sỹ dự bị.
C. Sỹ quan dự bị, quân nhân chuyên nghiệp dự bị, hạ sỹ quan và binh sỹ dự bị.
D. Tất cả quân nhân.
BÀI 10: XÂY DỰNG PHONG TRÀO TOÀN DÂN BẢO VỆ AN NINH TỔ QUỐC
Câu 1: Điền vào chỗ trống: “Huy động sức mạnh của nhân dân để …, phát hiện, ngăn chặn đấu tranh với các loại tội phạm, bảo vệ an ninh chính trị, giữ gìn trật tự an toàn xã hội”.
A. Tăng cường.
B. Phòng ngừa.
C. Kịp thời.
D. Chủ động.
Câu 2: Đặc điểm của phong trào toàn dân bảo vệ an ninh Tổ quốc là:
A. Diễn ra trên diện rộng, khắp mọi địa bàn, mọi lĩnh vực.
B. Hình thức hoạt động tự giác của quần chúng nhân dân.
C. Với mục đích bảo vệ an ninh chính trị, Đảng, Nhà nước và nhân dân.
D. Cuộc đấu tranh mang tính đặc thù của công an nhân dân.
Câu 3: Mục đích của phong trào toàn dân bảo vệ an ninh Tổ quốc là:
A. Huy động sức mạnh của nhân dân để phòng ngừa, ngăn chặn các loại tội phạm.
B. Huy động sức mạnh của nhân dân để đấu tranh hiệu quả với các loại tội phạm.
C. Huy động sức mạnh của nhân dân để kịp thời phát hiện và trực tiếp đấu tranh với các loại tội phạm.
D. Huy động sức mạnh của nhân dân để phòng ngừa, phát hiện, ngăn chặn, đấu tranh với các loại tội phạm. 
Câu 4: Vị trí của phong trào toàn dân bảo vệ an ninh Tổ quốc là gì?
A. Là phong trào mang tính tự giác để phát huy quyền làm chủ của nhân dân.
B. Là động lực chính để thúc đẩy xã hội phát triển.
C. Là một trong những biện pháp công tác cơ bản của công an nhân dân.
D. Là hạt nhân của lực lượng công an nhân dân trong đấu tranh với các loại tội phạm.
Câu 5: Phương pháp xây dựng phong trào toàn dân bảo vệ an ninh Tổ quốc là:
A. Xây dựng tổ chức Đảng, chính quyền, đoàn thể quần chúng tại cơ sở vững mạnh.
B. Xây dựng mở rộng liên kết, phối hợp giữa các ban, ngành, đoàn thể.
C. Nắm tình hình và xây dựng kế hoạch phát động phong trào toàn dân bảo vệ an ninh Tổ quốc.
D. Nắm tình hình và vận động toàn dân tích cực tham gia phong trào bảo vệ an ninh trật tự, an toàn xã hội.
Câu 6: Nội dung yêu cầu xây dựng các tổ chức quần chúng nòng cốt làm nhiệm vụ bảo vệ an ninh trật tự là:
A. Phải kiểm tra lý lịch rõ ràng, đủ điều kiện sức khỏe để thực hiện tốt nhiệm vụ.
B. Lựa chọn người có khả năng tổ chức, điều hành, bản thân tự giác, tự nguyện, hoàn thành các thủ tục báo cáo nhiệm vụ được giao.
C. Tuyển chọn đủ số lượng, chất lượng, phẩm chất đạo đức tốt.
D. Xác định rõ chức năng, nhiệm vụ, quyền hạn của tổ chức được xây dựng.
Câu 7: Nội dung cơ bản của công tác xây dựng phong trào toàn dân bảo vệ an ninh Tổ quốc là:
A. Vận động toàn dân nâng cao tinh thần cảnh giác cách mạng trong nhiệm vụ bảo vệ Tổ quốc.
B. Vận động toàn dân tích cực tham gia chương trình quốc gia phòng chống tội phạm.
C. Kết hợp chặt chẽ giữa quốc phòng với an ninh ở địa phương, đơn vị.
D. Kết hợp chặt chẽ giữa phát triển kinh tế xã hội với bài trừ tệ nạn xã hội.
Câu 8: Việc kết hợp và lồng ghép nội dung của phong trào bảo vệ an ninh Tổ quốc với các phong trào khác ở địa phương nhằm mục đích gì?
A. Tạo sự phong phú cho phong trào.
B. Tăng cường mối quan hệ khăng khít, hỗ trợ lẫn nhau giữa các phong trào.
C. Duy trì và thúc đẩy phong trào.
D. Để phong trào khác đạt hiệu quả như phong trào bảo vệ an ninh Tổ quốc.
Câu 9: “Vận động toàn dân tích cực tham gia chương trình quốc gia phòng chống tội phạm” là một trong những nội dung cơ bản của:
A. Công tác vận động quần chúng nâng cao tinh thần cảnh giác cách mạng.
B. Công tác xây dựng phong trào toàn dân bảo vệ an ninh Tổ quốc.
C. Công tác tuyên truyền của lực lượng công an nhân dân.
D. Công tác vận động quần chúng của các cấp, các ngành. 
Câu 10: Bảo vệ bí mật nhà nước là nội dung của:
A. Bảo vệ an ninh chính trị.
B. Bảo vệ an ninh kinh tế.
C. Bảo vệ an ninh tư tưởng văn hóa.
D. Bảo vệ an ninh trên lĩnh vực quốc phòng an ninh đối ngoại.
BÀI 11: NHỮNG VẤN ĐỀ CƠ BẢN VỀ BẢO VỆ AN NINH QUỐC GIA VÀ BẢO ĐẢM TRẬT TỰ AN TOÀN XÃ HỘI
Câu 1: Bảo vệ an ninh quốc gia là:
A. Phòng ngừa, phát hiện, ngăn chặn, đấu tranh làm thất bại các hoạt động xâm hại an ninh quốc gia.
B. Phòng ngừa, phát hiện, ngăn chặn đấu tranh các hành động gây rối của kẻ thù.
C. Bảo vệ bí mật Nhà nước và các mục tiêu quan trọng về an ninh quốc gia.
D. Bảo vệ các công trình, cơ sở chính trị, an ninh, quốc phòng, kinh tế khoa học công nghệ của Nhà nước.
Câu 2: Nội dung bảo vệ an ninh quốc gia gồm:
A. Bảo vệ an ninh: Chính trị nội bộ, kinh tế, văn hoá, tư tưởng, dân tộc, tôn giáo, lãnh thổ, biên giới, thông tin, quốc phòng an ninh và đối ngoại.
B. Bảo vệ an ninh: Chính trị nội bộ, an ninh kinh tế, Đảng, Nhà nước, nhân dân.
C. Bảo vệ an ninh: Kinh tế, văn hoá - tư tưởng, dân tộc và sự nghiệp công nghiệp hoá, hiện đại hoá.
D. Bảo vệ an ninh: Kinh tế, tôn giáo, dân tộc và nền văn hoá tiên tiến đậm đà bản sắc dân tộc.
Câu 3: Nội dung bảo đảm trật tự an toàn xã hội là:
A. Bảo vệ an ninh thông tin.
B. Bảo vệ môi trường.
C. Bảo vệ nền kinh tế thị trường nhiều thành phần.
D. Bảo vệ nền văn hoá.
Câu 4: Hiện nay Việt Nam khẳng định đối tác là:
A. Những ai chủ trương tôn trọng độc lập, chủ quyền và hợp tác bình đẳng cùng có lợi với Việt Nam.
B. Những quốc gia, vùng lãnh thổ, các tổ chức phi Chính phủ tạo điều kiện thuận lợi cho Việt Nam.
C. Những nước xã hội chủ nghĩa và các nước đang phát triển giúp đỡ Việt Nam.
D. Những tổ chức, cá nhân tôn trọng giúp đỡ Việt Nam.
Câu 5: Quan điểm của Đảng về bảo vệ an ninh quốc gia, bảo đảm trật tự, an toàn xã hội là:
A. Đảng lãnh đạo trực tiếp, tuyệt đối về mọi mặt bảo vệ an ninh quốc gia.
B. Công an là lực lượng nòng cốt, tăng cường hiệu lực quản lý của Nhà nước.
C. Kết hợp chặt chẽ nhiệm vụ xây dựng với nhiệm vụ bảo vệ Tổ quốc.
D. Phát huy quyền làm chủ của nhân dân trên lĩnh vực bảo vệ an ninh quốc gia, bảo đảm trật tự an toàn xã hội.
Câu 6: Căn cứ Luật an ninh quốc gia năm 2004, quyền và nghĩa vụ của công dân trong bảo vệ an ninh quốc gia là:
A. Tham gia lực lượng bảo vệ an ninh quốc gia và thực hiện nhiệm vụ bảo vệ an ninh quốc gia theo quy định của pháp luật.
B. Mọi công dân có nghĩa vụ tích cực tham gia đấu tranh phòng ngừa và chống tội phạm.
C. Hoạt động bảo vệ an ninh quốc gia có thành tích khen thưởng.
D. Là sự nghiệp toàn dân, cơ quan tổ chức, công dân trách nhiệm theo pháp luật.
Câu 7: Lực lượng nòng cốt trong sự nghiệp bảo vệ an ninh quốc gia và bảo đảm trật tự, an toàn xã hội là:
A. Công an.
B. Các đơn vị sự nghiệp.
C. Dân quân Tự vệ.
D. Toàn dân.
Câu 8: Để bảo đảm thắng lợi hoàn toàn và triệt để trong cuộc đấu tranh bảo vệ an ninh quốc gia, giữ gìn trật tự, an toàn xã hội, lực lượng công an phải:
A. Kết hợp sức mạnh của quần chúng với công tác nghiệp vụ của các cơ quan chuyên môn thuộc công an nhân dân
B. Kết hợp tai, mắt của quần chúng nhân dân với công tác nghiệp vụ của các cơ quan chuyên môn công an nhân dân
C. Kết hợp phong trào toàn dân bảo vệ an ninh Tổ quốc với công tác nghiệp vụ của các cơ quan chuyên môn
D. Kết hợp tính tự giác cách mạng của quần chúng với công tác nghiệp vụ của các cơ quan chuyên môn
Câu 9: Mối quan hệ giữa bảo vệ an ninh quốc gia và giữ gìn trật tự, an toàn xã hội là:
A. An ninh quốc gia hoạt động độc lập, không có liên quan đến công tác giữ gìn trật tự, an toàn xã hội
B. Trật tự an toàn xã hội được giữ vững sẽ tạo điều kiện cho an ninh quốc gia càng được củng cố vững chắc 
C. An ninh quốc gia quyết định trực tiếp và lâu dài đến công tác giữ gìn trật tự an toàn xã hội
D. Trật tự an toàn xã hội chi phối trực tiếp cả trước mắt và lâu dài đến công tác bảo vệ an ninh quốc gia
Câu 10: “Bảo vệ an ninh quốc gia phải kết hợp chặt chẽ với giữ gìn trật tự, an toàn xã hội” là một trong những nội dung của:
A. Giải pháp bảo vệ an ninh quốc gia, giữ gìn trật tự, an toàn xã hội
B. Nhiệm vụ bảo vệ an ninh quốc gia, giữ gìn trật tự, an toàn xã hội
C. Quan điểm bảo vệ an ninh quốc gia, giữ gìn trật tự, an toàn xã hội
D. Biện pháp bảo vệ an ninh quốc gia, giữ gìn trật tự, an toàn xã hội
Câu 11: “Đảng lãnh đạo trực tiếp về mọi mặt là nhân tố quyết định thắng lợi của cuộc đấu tranh bảo vệ an ninh quốc gia và giữ gìn trật tự an toàn xã hội” là một trong những nội dung thể hiện:
A. Quan điểm bảo vệ an ninh quốc gia, giữ gìn trật tự, an toàn xã hội
B. Nhiệm vụ bảo vệ an ninh quốc gia, giữ gìn trật tự, an toàn xã hội
C. Tính chất bảo vệ an ninh quốc gia, giữ gìn trật tự, an toàn xã hội
D. Biện pháp bảo vệ an ninh quốc gia, giữ gìn trật tự, an toàn xã hội
Câu 12: Vai trò lãnh đạo của Đảng ta về bảo vệ an ninh quốc gia, trật tự, an toàn xã hội là:
A. Đảng lãnh đạo trực tiếp, tuyệt đối về mọi mặt
B. Đảng đề ra đường lối và giao cho Nhà nước thực hiện
C. Đảng trực tiếp chỉ đạo Nhà nước và toàn xã hội thực hiện
D. Đảng xác định đường lối, chính sách và chỉ đạo cả nước thực hiện 
    </textarea>

    <!-- CORE LOGIC & ENGINE -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            try {
                // Bộ nhớ TỰ ĐỘNG CHẤM ĐIỂM (Cập nhật 258 đáp án chuẩn xác nhất)
                const answerKeys = [
                    "ABDADA", // Bài 1
                    "ACDCCAAABCCCBCCBCDBCACDBCAAACB", // Bài 2
                    "BADDCDACBBABCAABACBABCBACA", // Bài 3
                    "BDCCCDBDCBCACAACACCCCDBAACBACDCDAAAD", // Bài 4
                    "DACCCBDBCCBCADBDAABBBDC", // Bài 5
                    "ADABDAACBDBDDBACAADACCA", // Bài 6
                    "DDDDACBBCAABABBCBCBCDCBB", // Bài 7
                    "BABABBBAABCDBABBAAAACDACCDBCCADCACBBABACCD", // Bài 8
                    "CCDADBCADACAABABCACADBACAC", // Bài 9
                    "BBDCABABBA", // Bài 10
                    "AADAAAAABCAA" // Bài 11
                ];

                let rawText = document.getElementById("raw-data").value;
                const lessonBlocks = rawText.split(/(?=BÀI \d+:)/g).filter(s => s.trim().length > 10);
                
                // Parse dữ liệu
                const parsedData = lessonBlocks.map((lessonStr, lessonIndex) => {
                    const lines = lessonStr.split('\n').filter(l => l.trim());
                    const title = lines[0].trim();
                    const contentText = lessonStr.substring(lessonStr.indexOf('\n')).trim();
                    const questionBlocks = contentText.split(/(?=Câu \d+:)/g).filter(s => s.trim().length > 10);
                    
                    const parsedQuestions = questionBlocks.map((qStr, qIndex) => {
                        const parts = qStr.split(/\s+(?=[A-D]\.\s)/g);
                        const questionText = parts[0].trim();
                        
                        let options = [];
                        let correctIndex = -1;
                        
                        // Đối chiếu thuật toán để tìm ra vị trí đáp án đúng
                        const correctLetter = answerKeys[lessonIndex] ? answerKeys[lessonIndex][qIndex] : null;

                        parts.slice(1).forEach((opt, idx) => {
                            let text = opt.trim();
                            let prefix = text.substring(0, 1).toUpperCase(); 
                            if (correctLetter && prefix === correctLetter) correctIndex = idx;
                            options.push(text);
                        });

                        return { question: questionText, options: options, correctIndex: correctIndex };
                    });

                    return { title, questions: parsedQuestions };
                });

                // Các Element HTML
                const lessonListEl = document.getElementById("lesson-list");
                const quizContainerEl = document.getElementById("quiz-container");
                const currentLessonTitleEl = document.getElementById("current-lesson-title");
                const questionCountEl = document.getElementById("question-count");
                const scoreDisplayEl = document.getElementById("score-display");
                
                // Menu Mobile Event Listeners
                const sidebar = document.getElementById("sidebar");
                const menuBtn = document.getElementById("menu-btn");
                const closeMenuBtn = document.getElementById("close-menu-btn");
                const sidebarOverlay = document.getElementById("sidebar-overlay");

                function toggleMenu() {
                    sidebar.classList.toggle("hidden");
                    sidebar.classList.toggle("flex");
                    sidebarOverlay.classList.toggle("hidden");
                }
                menuBtn.addEventListener("click", toggleMenu);
                closeMenuBtn.addEventListener("click", toggleMenu);
                sidebarOverlay.addEventListener("click", toggleMenu);

                // Khởi tạo Sidebar
                function renderLessons() {
                    lessonListEl.innerHTML = "";
                    parsedData.forEach((lesson, index) => {
                        const btn = document.createElement("button");
                        btn.className = "w-full text-left px-4 py-3 md:py-2.5 rounded-lg text-sm font-semibold text-slate-600 hover:bg-blue-50 hover:text-blue-700 transition-colors border border-transparent";
                        
                        const shortTitleMatch = lesson.title.match(/(BÀI \d+)/i);
                        const shortTitle = shortTitleMatch ? shortTitleMatch[0] : `Phần ${index + 1}`;
                        
                        btn.innerHTML = `<i class="fas fa-layer-group text-slate-400 mr-2 w-5 text-center"></i> ${shortTitle}`;
                        btn.onclick = () => {
                            loadLesson(index, btn);
                            if (window.innerWidth < 768) toggleMenu();
                        };
                        lessonListEl.appendChild(btn);
                    });
                    
                    if (parsedData.length > 0) loadLesson(0, lessonListEl.firstChild);
                }

                let scoreCorrect = 0;
                let scoreTotal = 0;

                function updateScoreboard() {
                    scoreDisplayEl.innerHTML = `<i class="fas fa-check-double mr-1.5 md:mr-2"></i> Đúng: ${scoreCorrect} / ${scoreTotal}`;
                }

                // Load nội dung 1 Bài Học
                function loadLesson(index, btnElement) {
                    document.querySelectorAll("#lesson-list button").forEach(btn => {
                        btn.classList.remove("bg-blue-50", "text-blue-700", "border-blue-100");
                        if(btn.querySelector("i")) btn.querySelector("i").classList.replace("text-blue-600", "text-slate-400");
                    });
                    
                    if (btnElement) {
                        btnElement.classList.add("bg-blue-50", "text-blue-700", "border-blue-100");
                        if(btnElement.querySelector("i")) btnElement.querySelector("i").classList.replace("text-slate-400", "text-blue-600");
                    }

                    const lesson = parsedData[index];
                    currentLessonTitleEl.textContent = lesson.title;
                    questionCountEl.innerHTML = `<i class="fas fa-list-ol mr-2"></i> ${lesson.questions.length} Câu`;
                    scoreCorrect = 0;
                    scoreTotal = 0;
                    updateScoreboard();

                    quizContainerEl.innerHTML = "";
                    const wrapper = document.createElement("div");
                    wrapper.className = "max-w-4xl mx-auto space-y-6 pb-20";

                    lesson.questions.forEach((q, qIndex) => {
                        const card = document.createElement("div");
                        card.className = "bg-white rounded-xl shadow-sm border border-slate-200 p-5 md:p-7";

                        const qTitle = document.createElement("h3");
                        qTitle.className = "text-base md:text-lg font-bold text-slate-800 mb-5 leading-relaxed";
                        qTitle.textContent = q.question;
                        card.appendChild(qTitle);

                        const optionsContainer = document.createElement("div");
                        optionsContainer.className = "space-y-3";
                        optionsContainer.dataset.answered = "false";

                        q.options.forEach((optText, optIndex) => {
                            const optBtn = document.createElement("button");
                            optBtn.className = "option-btn w-full text-left px-4 md:px-5 py-3 rounded-lg border-2 border-slate-100 text-sm md:text-base text-slate-700 bg-white focus:outline-none flex justify-between items-center";
                            
                            let prefix = optText.substring(0, 2); 
                            let content = optText.substring(2);
                            
                            optBtn.innerHTML = `<span><span class="font-extrabold mr-2 text-slate-400">${prefix}</span> <span class="font-medium">${content}</span></span><i class="status-icon text-xl hidden"></i>`;
                            
                            optBtn.onclick = () => {
                                if (optionsContainer.dataset.answered === "true") return;
                                optionsContainer.dataset.answered = "true";
                                
                                scoreTotal++;

                                if (optIndex === q.correctIndex) {
                                    scoreCorrect++;
                                    optBtn.classList.add("answered", "border-green-500", "bg-green-50", "text-green-800");
                                    optBtn.classList.remove("border-slate-100", "bg-white", "text-slate-700");
                                    
                                    let icon = optBtn.querySelector('.status-icon');
                                    icon.classList.remove("hidden");
                                    icon.classList.add("fas", "fa-check-circle", "text-green-500");
                                } else {
                                    optBtn.classList.add("answered", "border-red-500", "bg-red-50", "text-red-800");
                                    optBtn.classList.remove("border-slate-100", "bg-white", "text-slate-700");
                                    
                                    let icon = optBtn.querySelector('.status-icon');
                                    icon.classList.remove("hidden");
                                    icon.classList.add("fas", "fa-times-circle", "text-red-500");
                                    
                                    // Tự động đánh dấu xanh cho câu đúng thực sự
                                    if(q.correctIndex !== -1) {
                                        const correctBtn = optionsContainer.children[q.correctIndex];
                                        correctBtn.classList.add("border-green-500", "bg-green-50", "text-green-800");
                                        correctBtn.classList.remove("border-slate-100", "bg-white", "text-slate-700");
                                        let correctIcon = correctBtn.querySelector('.status-icon');
                                        correctIcon.classList.remove("hidden");
                                        correctIcon.classList.add("fas", "fa-check-circle", "text-green-500");
                                    }
                                }

                                updateScoreboard();
                            };
                            optionsContainer.appendChild(optBtn);
                        });

                        card.appendChild(optionsContainer);
                        wrapper.appendChild(card);
                    });

                    quizContainerEl.appendChild(wrapper);
                    quizContainerEl.scrollTop = 0;
                }

                renderLessons();

            } catch (error) {
                document.getElementById("quiz-container").innerHTML = `<div class="text-center text-red-500 mt-10 p-5 bg-red-50 rounded-lg"><b>Đã xảy ra lỗi khởi tạo:</b><br/>${error.message}</div>`;
            }
        });
    </script>
</body>
